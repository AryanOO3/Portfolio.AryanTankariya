<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b18" />
    <title>Aryan Tankariya // Interactive Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </head>
  <body class="solar-page app-loading">
    <div class="site-noise"></div>
    <canvas id="space-canvas" aria-label="Interactive solar system"></canvas>
    <div class="solar-ui" aria-live="polite">
      <span class="solar-brand">ARYAN TANKARIYA<span> / PORTFOLIO</span></span>
      <span class="solar-instruction">scroll to explore · select a planet to visit a page</span>
      <span class="solar-selected" id="selected-planet">interactive portfolio / home</span>
    </div>
    <div class="planet-labels" aria-hidden="true">
      <span id="label-about">Profile / About Me</span>
      <span id="label-resume">Mission Log / Resume</span>
      <span id="label-projects">Project Bay / Projects</span>
      <span id="label-design">Design Lab / Graphic Design</span>
      <span id="label-certifications">Credentials / Certifications</span>
    </div>
  </body>
</html>
